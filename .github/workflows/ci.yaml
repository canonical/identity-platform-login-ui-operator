name: ci
run-name: CI for ${{ github.sha }} on ${{ github.ref_name }}

on:
   workflow_dispatch:
   workflow_call:
   push:
     branches:
     - "main"
     - "release-**"
     - "track/**"
     paths-ignore:
     - "terraform/**"
   pull_request:
     branches:
     - "*"
     paths-ignore:
       - "terraform/**"

jobs:
  openspec-check:
    name: OpenSpec Check
    uses: ./.github/workflows/openspec-check.yaml

  tests:
    name: CI
    uses: canonical/identity-team/.github/workflows/charm-pull-request.yaml@add-multi-juju-lifecycle-tests
    with:
      container-name: "login-ui"
      use-charmcraftcache: false
      juju-channels: '["3.6/stable", "4.0/stable"]'
